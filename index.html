
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#090b14" />
  <title>Nova — Authentication</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="shell">
    <section class="auth-card" id="authView">
      <a class="brand" href="#" aria-label="Nova home">
        <span class="brand-icon">N</span>
        <span>NOVA<span class="brand-dot">.</span></span>
      </a>

      <div class="heading">
        <p class="eyebrow">YOUR SPACE. YOUR RULES.</p>
        <h1 id="formTitle">Welcome back</h1>
        <p class="muted" id="formSubtitle">
          Sign in to continue to your account.
        </p>
      </div>

      <div id="message" class="message" role="status" hidden></div>

      <form id="loginForm" class="form">
        <label for="loginEmail">Email address</label>
        <input id="loginEmail" type="email" autocomplete="email"
          placeholder="you@example.com" required />

        <label for="loginPassword">Password</label>
        <input id="loginPassword" type="password"
          autocomplete="current-password" placeholder="Your password"
          required minlength="6" />

        <div class="form-row">
          <span></span>
          <button type="button" class="text-btn" id="forgotLink">
            Forgot password?
          </button>
        </div>

        <button class="primary-btn" type="submit" id="loginSubmit">
          Sign in <span>→</span>
        </button>
      </form>

      <form id="registerForm" class="form" hidden>
        <label for="registerName">Full name</label>
        <input id="registerName" type="text" autocomplete="name"
          placeholder="Your name" required maxlength="80" />

        <label for="registerEmail">Email address</label>
        <input id="registerEmail" type="email" autocomplete="email"
          placeholder="you@example.com" required />

        <label for="registerPassword">Password</label>
        <input id="registerPassword" type="password"
          autocomplete="new-password" placeholder="At least 6 characters"
          required minlength="6" />

        <button class="primary-btn" type="submit" id="registerSubmit">
          Create account <span>→</span>
        </button>
      </form>

      <form id="forgotForm" class="form" hidden>
        <label for="forgotEmail">Email address</label>
        <input id="forgotEmail" type="email" autocomplete="email"
          placeholder="you@example.com" required />

        <button class="primary-btn" type="submit" id="forgotSubmit">
          Send reset link <span>→</span>
        </button>
      </form>

      <form id="resetForm" class="form" hidden>
        <label for="newPassword">New password</label>
        <input id="newPassword" type="password"
          autocomplete="new-password" placeholder="New password"
          required minlength="6" />

        <label for="confirmPassword">Confirm password</label>
        <input id="confirmPassword" type="password"
          autocomplete="new-password" placeholder="Repeat password"
          required minlength="6" />

        <button class="primary-btn" type="submit" id="resetSubmit">
          Update password <span>→</span>
        </button>
      </form>

      <div class="divider" id="divider"><span>OR CONTINUE WITH</span></div>

      <button type="button" class="google-btn" id="googleBtn">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#EA4335"
            d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"
            transform="translate(0 5)"/>
          <path fill="#4285F4"
            d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.73 7.18l7.62 5.91c4.45-4.11 7.15-10.16 7.15-17.56z"/>
          <path fill="#FBBC05"
            d="M10.53 28.59a14.4 14.4 0 0 1 0-9.18l-7.98-6.19a24 24 0 0 0 0 21.56l7.98-6.19z"
            transform="translate(0 0)"/>
          <path fill="#34A853"
            d="M24 48c6.48 0 11.93-2.13 15.9-5.89l-7.62-5.91c-2.12 1.42-4.84 2.3-8.28 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        Continue with Google
      </button>

      <p class="switch-text" id="switchText">
        Don't have an account?
        <button type="button" class="text-btn" id="switchLink">
          Create account
        </button>
      </p>
      <p class="footer-note">SECURE AUTHENTICATION · POWERED BY SUPABASE</p>
    </section>

    <section class="home-card" id="homeView" hidden>
      <a class="brand" href="#">
        <span class="brand-icon">N</span>
        <span>NOVA<span class="brand-dot">.</span></span>
      </a>

      <div class="avatar" id="avatar">U</div>
      <p class="eyebrow">YOUR PERSONAL SPACE</p>
      <h1>You're in.</h1>
      <p class="muted">You have successfully signed in.</p>

      <div class="profile-box">
        <span class="profile-label">SIGNED-IN ACCOUNT</span>
        <strong id="userName">User</strong>
        <p id="userEmail"></p>
      </div>

      <div class="status"><span></span> Authenticated session</div>
      <button class="primary-btn" id="logoutBtn" type="button">
        Sign out <span>↗</span>
      </button>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
